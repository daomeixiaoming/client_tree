syntax = "proto3";
package client.sea_game;
option java_package = "com.org.platform.websocket.client";
import "common/common.proto";


/**
  RequestCode、ResponseCode等都使用游戏id + 序号组成，避免冲突
 */
enum RequestCode {
  INVALID_REQUEST = 0;
  PING = 1;

  //#########################
  //
  //     100以前给system用
  //
  //#########################


  // ##### 八仙过海 start #####
  // 八仙过海 - 加入房间请求
  SEA_GAME_JOIN_ROOM_REQUEST = 100;
  // 八仙过海 - 下注请求
  SEA_GAME_BET_REQUEST = 101;
  // 八仙过海 - 上车请求
  SEA_GAME_IN_CAR_REQUEST = 102;
  // 八仙过海 - 取消自动下车请求
  SEA_GAME_AUTO_OUT_CAR_REQUEST = 103;
  // 八仙过海 - 获取上车列表请求
  SEA_GAME_FETCH_BOARDING_LIST_REQUEST = 104;
  // ##### 八仙过海 end #####
}

enum ResponseCode {
  INVALID_RESPONSE = 0;
  PONG = 1;
  ERROR = 2;

  //#########################
  //
  //     100以前给system用
  //
  //#########################

  // ##### 八仙过海 start #####
  // 八仙过海 - 加入房间响应（与请求使用相同值）
  SEA_GAME_JOIN_ROOM_RESPONSE = 100;
  // 八仙过海 - 下注响应（与请求使用相同值）
  SEA_GAME_BET_RESPONSE = 101;
  // 八仙过海 - 下注结果（其他人，无对应请求）
  SEA_GAME_BET_OTHER_RESPONSE = 102;
  // 八仙过海 - 状态同步响应（无对应请求）
  SEA_GAME_STATUS_SYNC_RESPONSE = 103;
  // 八仙过海 - 庄局数据变更响应（无对应请求）
  SEA_GAME_BUREAU_CHANGED_RESPONSE = 104;
  // 八仙过海 - 中奖项通知（无对应请求）
  SEA_GAME_LOTTERY_RESPONSE = 105;
  // 八仙过海 - 比赛结果响应（无对应请求）
  SEA_GAME_SETTLE_RESPONSE = 106;
  // 八仙过海 - 刷新上车列表响应（无对应请求）
  SEA_GAME_FETCH_BOARDING_UPDATE_RESPONSE = 107;
  // 八仙过海 - 庄家变更响应（无对应请求）
  SEA_GAME_BANKER_CHANGE_RESPONSE = 108;
  // 八仙过海 - 金币变更响应（无对应请求）
  SEA_GAME_GOLD_UPDATE_RESPONSE = 109;
  // ##### 八仙过海 end #####

}

message Request {
  RequestCode cmd = 1;
  // 没有body的消息，可以不传body，但只要传了body，oneof 里的就必须设置一个
  RequestBody body = 2;
}

message RequestBody {
  oneof body {
    //#########################
    //
    //     100以前给system用
    //
    //#########################


    // ##### 八仙过海 start #####
    // 八仙过海 - 加入房间请求
    JoinRoomRequest seaGameJoinRoom = 100;
    // 八仙过海 - 下注请求
    BetRequest seaGameBet = 101;
    // ##### 八仙过海 end #####
  }
}
message Response {
  ResponseCode cmd = 1;
  // 没有body的消息，可以不传body，但只要传了body，oneof 里的就必须设置一个
  ResponseBody body = 2;
}

message ResponseBody {
  oneof body {
    common.ErrorMessage error = 1;
    //#########################
    //
    //     100以前给system用
    //
    //#########################

    // ##### 八仙过海 start #####
    // 八仙过海 - 加入房间响应（与 ResponseCode 值对应）
 NetMessage
    // 八仙过海 - 刷新上车列表响应（与 ResponseCode 值对应，无 body，使用 Empty）
    // 八仙过海 - 庄家变更响应（与 ResponseCode 值对应）
    BankerChangeResponse seaGameBankerChange = 107;
    // 八仙过海 - 金币变更响应（与 ResponseCode 值对应）
    GoldUpdateResponse seaGameGoldUpdate = 108;
    // ##### 八仙过海 end #####
  }
}
// ========== 请求消息 ==========

// 加入房间请求
message JoinRoomRequest {
  // 主播房间号
  int64 roomId = 1;
  // 主播ID
  int64 anchorId = 2;
}

// 下注请求
message BetRequest {
  // 角色ID:1~8  角色ID
  int32 itemId = 1;
  // 筹码id:1~5
  int32 optionId = 2;
}

// ========== 响应消息 ==========

// 押注项信息
message StakeItem {
  // 角色ID:1~8  角色ID
  int32 itemId = 1;
  // 单人押注值
  int64 singlePlayerBet = 2;
  // 总押注
  int64 totalBet = 3;
  // 筹码id:1~5
  int32 optionId = 4;
}

// 押注项信息（简化版，用于下注结果）
message StakeItem2 {
  // 角色ID:1~8  角色ID
  int32 itemId = 1;
  // 总押注
  int64 totalBet = 2;
  // 单人押注值
  int64 singlePlayerBet = 3;
  // 筹码id:1~5
  repeated int32 optionIds = 4;
  // 角色赔率
  int32 rate = 5;
}

// 玩家个人信息
message StakePerson {
  // 用户ID
  int64 uid = 1;
  // 头像
  string avatar = 2;
  // 玩家昵称
  string nickName = 3;
  // 用户剩余的游戏货币
  int64 energy = 4;
  // 用户战绩
  int64 record = 5;
  // 是否在车主队列
  bool isInCar = 6;
}

// 庄家信息
message Banker {
  // 用户ID
  int64 uid = 1;
  // 游戏货币
  int64 energy = 2;
  // 昵称
  string nickName = 3;
  // 头像
  string avatar = 4;
  // 局数
  int32 bureau = 5;
}

// 上车信息
message InCarInfo {
  // 用户ID
  int64 uid = 1;
  // 玩家昵称
  string nickName = 2;
  // 头像
  string avatar = 3;
  // 上车模式 0普通模式、1急速模式
  int32 module = 4;
  // 上车游戏货币（上车基数游戏货币）
  int64 energy = 5;
  // 是否自动上车
  bool autoInCar = 6;
  // 做庄局数
  int32 bureau = 7;
  // 剩余游戏货币
  int64 residue = 8;
  // 剩余游戏货币【每一把开始的时候赋值即可 在状态1的段】
  int64 residue2 = 9;
  // 是否是机器人
  bool isRobot = 10;
}

// 结算结果
message SettleResult {
  // 用户ID
  int64 uid = 1;
  // 玩家昵称
  string nickName = 2;
  // 游戏货币【获得游戏货币】
  int64 energy = 3;
  // 胜负【1赢 2输】
  int32 win = 4;
}

// 加入房间响应
message JoinRoomResponse {
  // 系统时间(时间戳精确到毫秒)
  int64 sysTime = 1;
  // 局数
  int64 bureau = 2;
  // 房间状态
  int32 state = 3;
  // 结束时间
  int64 time = 4;
  // 押注项
  repeated StakeItem2 stakeItem = 5;
  // 押注人信息
  StakePerson stakePerson = 6;
  // 车主消息
  Banker racingBanker = 7;
  // 上车列表
  repeated InCarInfo inCarModels = 8;
}

// 下注响应
message BetResponse {
  // 用户剩余的游戏货币
  int64 energy = 1;
  // 押注项
  StakeItem stakeItem = 2;
}

// 下注结果（其他人）
message BetOtherResponse {
  // 角色ID:1~8  角色ID
  int32 itemId = 1;
  // 总押注
  int64 totalBet = 2;
  // 筹码id:1~5
  int32 optionId = 3;
}

// 状态同步响应
message StatusSyncResponse {
  // 房间状态
  int32 state = 1;
  // 未来时间(时间戳精确到毫秒)
  int64 time = 2;
  // 系统时间(时间戳精确到毫秒)
  int64 sysTime = 3;
}

// 庄局数据变更响应
message BureauChangedResponse {
  // 用户uid
  int64 uid = 1;
  // 当前最新做庄局数
  int64 bureau = 2;
}

// 中奖项通知
message LotteryResponse {
  // 中奖ID
  int32 itemId = 1;

  // 预开奖ID1
  int32 itemId2 = 2;

  // 预开奖ID2
  int32 itemId3 = 3;

}

// 比赛结果响应
message SettleResponse {
  // 中奖ID
  int32 itemId = 1;
  // 用户战绩（用户个人所得）
  int64 record = 2;
  // 0未参与 1赢 2输
  int32 win = 3;
  // 游戏货币【获得游戏货币】
  int64 energy = 4;
  // 车主剩余能量 本局战力
  int64 energy2 = 5;
  // 结果集
  repeated SettleResult settle = 6;
}


// 庄家变更响应
message BankerChangeResponse {
  // 用户ID
  int64 uid = 1;
  // 玩家昵称
  string nickName = 2;
  // 头像
  string avatar = 3;
  // 游戏货币
  int64 energy = 4;
  // 是否在车主队列
  bool isInCar = 5;
}

// 金币变更响应
message GoldUpdateResponse {
  // 玩家ID
  int64 uid = 1;
  // 游戏货币
  int64 energy = 2;
}
